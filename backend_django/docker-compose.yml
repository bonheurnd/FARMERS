version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nasho_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nasho_irrigation}
      POSTGRES_USER: ${POSTGRES_USER:-nasho_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisInProduction123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nasho_admin} -d ${POSTGRES_DB:-nasho_irrigation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nasho_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: nasho_drf_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 nasho_irrigation.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=nasho_irrigation.settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-nasho-kirehe-rwanda-production-key-2026}
      - DEBUG=${DEBUG:-False}
      - DB_NAME=${POSTGRES_DB:-nasho_irrigation}
      - DB_USER=${POSTGRES_USER:-nasho_admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-ChangeThisInProduction123!}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - AFRICASTALKING_USERNAME=${AFRICASTALKING_USERNAME:-}
      - AFRICASTALKING_API_KEY=${AFRICASTALKING_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
  media_volume:
